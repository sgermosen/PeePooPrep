name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/PeePoo/PeePoo.sln

      - name: Build
        run: dotnet build src/PeePoo/PeePoo.sln -c Release --no-restore

      - name: Test (unit + HTTP integration, including the website)
        run: dotnet test src/PeePoo/Tests/Tests.csproj -c Release --no-build --verbosity normal

      - name: Check for vulnerable packages
        run: |
          dotnet list src/PeePoo/PeePoo.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

  mobile:
    name: Android app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build (Debug, unsigned)
        working-directory: src/MauiApp/PeePooFinder
        run: dotnet build -f net10.0-android -c Debug -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"

  docker:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t peepoo src/PeePoo

      - name: Run and check the site and API respond
        run: |
          docker run -d --name peepoo -p 8080:8080 -e ASPNETCORE_ENVIRONMENT=Development peepoo
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/ | grep -q "PeePoo"
          curl -fs "http://localhost:8080/api/places?limit=1" | grep -q '"name"'
          docker logs peepoo | tail -20
